<!--
  Active response registration for the Wazuh manager.
  Add these blocks to /var/ossec/etc/ossec.conf and restart wazuh-manager.

  firewall-drop is built in and already registered by default. It is included
  here for reference so the API payload in scripts/wazuh_endpoint_isolate.py
  can be traced back to a command block.

  host-isolate is NOT a built-in Wazuh script. If full network isolation is
  required, the executable must be written and placed in
  /var/ossec/active-response/bin/ on the agent, registered as a <command>
  block below, and invoked through the API with "custom": true.
-->

<ossec_config>

  <!-- Built in. Blocks a source IP using the endpoint firewall. -->
  <command>
    <name>firewall-drop</name>
    <executable>firewall-drop</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <!-- Custom. Requires host-isolate to exist on the agent before use. -->
  <command>
    <name>host-isolate</name>
    <executable>host-isolate</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <!-- API-only trigger: no <rules_id> or <level>, so this fires only when
       called explicitly through PUT /active-response. -->
  <active-response>
    <disabled>no</disabled>
    <command>firewall-drop</command>
    <location>local</location>
    <timeout>600</timeout>
  </active-response>

</ossec_config>
